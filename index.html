<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&amp;L Assistant</title>
<style>
body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:#0d1117;color:#e6edf3;display:flex;flex-direction:column;height:100vh}
header{background:#161b22;padding:14px;text-align:center;font-weight:bold;font-size:18px;border-bottom:1px solid #30363d;position:relative}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-start;background:#1f6feb;color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-end;background:#21262d;border:1px solid #30363d;border-bottom-left-radius:4px}
.who{font-size:11px;color:#8b949e;margin-top:4px}
.thumb{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.dlbtn{display:inline-block;margin-top:8px;padding:8px 14px;background:#1f6feb;color:#fff;border-radius:14px;text-decoration:none;font-size:14px}
#pvbar{display:none;padding:6px 10px;background:#161b22;border-top:1px solid #30363d;align-items:center;gap:10px}
#pvimg{height:52px;border-radius:8px}
#pvx{cursor:pointer;color:#f85149;font-size:20px;padding:4px}
#bar{display:flex;gap:6px;padding:10px;background:#161b22;border-top:1px solid #30363d}
#in{flex:1;padding:12px;border-radius:20px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:16px;min-width:0}
button{padding:12px 16px;border:none;border-radius:20px;background:#1f6feb;color:#fff;font-size:16px;cursor:pointer}
.icobtn{padding:12px 12px;background:#21262d;border:1px solid #30363d}
.rec{background:#b3261e !important;animation:pu 1s infinite}
@keyframes pu{50%{opacity:.55}}
#setup{padding:20px;display:none;flex-direction:column;gap:12px}
#setup input{padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px;direction:ltr}
.lbl{font-size:14px;color:#8b949e;line-height:1.7}
</style>
</head>
<body>
<header>🤖 M&amp;L Assistant v14<span onclick="showSetup()" style="position:absolute;left:12px;top:14px;font-size:20px;cursor:pointer">⚙️</span><span onclick="clearChat()" style="position:absolute;right:12px;top:14px;font-size:20px;cursor:pointer">🗑️</span></header>
<div id="setup">
<div class="lbl">حط مفتاحك مرة واحدة بس. المفتاح بيتخزن على جهازك انت بس، ومبيتبعتش غير للخدمة نفسها عشان ترد عليك.</div>
<input id="k_gemini" placeholder="Gemini API Key">
<input id="k_groq" placeholder="Groq API Key (مجاني برضه)">
<label class="lbl" style="direction:rtl"><input type="checkbox" id="k_claude" style="direction:rtl"> فعّل كلود مجانًا عن طريق Puter (من غير مفتاح، بحد شهري، وهيسألك تسجل دخول أول مرة)</label>
<button onclick="saveKeys()">ابدأ 🚀</button>
<button onclick="clearKeys()" style="background:#6e2424">مسح المفاتيح المحفوظة 🗑️</button>
</div>
<div id="chat"></div>
<div id="pvbar"><img id="pvimg" alt=""><span style="font-size:13px;color:#8b949e">الصورة جاهزة، اكتب السعر وابعت 📸</span><span id="pvx" onclick="clearPreview()">✕</span></div>
<div id="bar">
<button class="icobtn" onclick="pickImg()" title="ابعت صورة منتج">📎</button>
<button class="icobtn" id="mic" onclick="toggleMic()" title="اتكلم بدل ما تكتب">🎤</button>
<input id="in" placeholder="اكتب رسالتك أو السعر مع الصورة..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">ابعت</button>
</div>
<input type="file" id="filein" accept="image/*" style="display:none" onchange="onImg(event)">
<script>
var chat=document.getElementById('chat');
var SYSTEM_PROMPT='انت المساعد الشخصي لمحمود، صاحب براند M&L للإكسسوارات (خواتم، سلاسل، أساور، طقوم كابلز) بيبيع على فيسبوك وواتساب في مصر. بتتكلم معاه بالعامية المصرية زي صاحبه، وبتساعده في شغل البراند: بوستات بيع جاهزة للنسخ واللصق، أفكار تسويق مجانية، ردود على العملاء (الأسعار من ١٠٠ لـ ٣٥٠ جنيه، شحن لكل المحافظات، دفع كاش عند الاستلام، لينك الطلب wa.me/201148434241)، ترجمة إنجليزي لما يطلب، وأفكار أتمتة وAI. خلي ردودك مختصرة وعملية.\n\nولما محمود يبعتلك صورة منتج، اكتب بوستين جاهزين للنسخ: الأول بوست فيسبوك، وبعده خط فاصل واضح زي "===== واتساب ====="، وبعده بوست واتساب.\n\nبوست الفيسبوك (شيك ومحترم جدًا ويلفت العين، بالترتيب ده بالظبط):\n١) سطر هوك شيك يشد العين مع إيموجي.\n٢) تفاصيل القطعة اللي تبيعها من اللي باين في الصورة (مثلًا "ضد تغيير اللون")، ولو كومبو اذكر قطعه.\n٣) سطر الخامة لوحده بالصيغة دي بالظبط: "Stainless Steel pure" أو "Gold Plated"، ولو كومبو مخلوط سطر خامة لكل قطعة.\n٤) سطر السعر بالصيغة دي: "السعر: ١٥٠ ج بس 💸" أو للكومبو "سعر الكومبو بالكامل: ٢٥٠ ج بس 💸" وبعدها "عروض وايت فرايداي ⏰🔥".\n٥) سطر الطلب باللينك wa.me/201148434241.\n\nبوست الواتساب (قصير ٣-٤ سطور بالإيموجيز بأسلوب محمود نفسه):\n١) هوك فيه اسم القطعة وحماس زي "موووت 😍✨".\n٢) سطر الخامة بالصيغ دي بالظبط: "Gold Plated (جولد بليتد) ✨" أو "Stainless Steel pure 🔥🔥💫" أو "Necklace drops 🔥🔥💫".\n٣) سطر السعر زي "السعر ١٥٠ فقط عروض جمعه 🔥💸⏰" أو للكومبو "سعر الكومبو بالكامل ٢٢٥ بس عروض الجمعة 🔥💸⏰".\n\nقواعد الخامة: القطعة اللي فيها فصوص كتير غالبًا Gold Plated. السادة من غير فصوص Stainless Steel pure مهما كان لونها. السلسلة اللي عليها دلاية اسمها "Necklace drops". الخواتم Gold Plated. ولو مش متأكد من الخامة اسأله ومتخمنش.\n\nولو محمود بعتلك مسودة بوست من كتابته هو، حسّنها بس خلي صوته وسطوره زي ما هي.\nولو مكتبش السعر مع الصورة، اسأله عن السعر في سطر واحد ومتكتبش البوستين، وماتخترعش سعر من عندك أبدًا.';

var MEMK={};
function storeSet(k,v){
 try{localStorage.setItem(k,v);if(localStorage.getItem(k)===v)return;}catch(e){}
 MEMK[k]=v;
}
function storeGet(k){
 try{var v=localStorage.getItem(k);if(v)return v;}catch(e){}
 return MEMK[k]||null;
}
function saveMsgs(){try{storeSet('k_msgs',JSON.stringify(msgs));}catch(e){}}
function loadMsgs(){
 try{
  var raw=storeGet('k_msgs');
  if(!raw)return;
  var arr=JSON.parse(raw);
  if(!Array.isArray(arr))return;
  msgs=arr;
  msgs.forEach(function(m){add(m.content,m.role==='user'?'me':'ai');});
 }catch(e){}
}
function storeClear(){
 storeSet('k_msgs','');
 ['k_gemini','k_groq','k_qwen','k_claude'].forEach(function(k){
  try{localStorage.removeItem(k);}catch(e){}
  delete MEMK[k];
 });
}
var msgs=[];
function geminiProvider(model){
 return {
  name: model.indexOf('lite')>-1 ? 'Gemini Lite' : 'Gemini',
  key: storeGet('k_gemini'),
  vision: true,
  call: async function(img){
   var contents=msgs.map(function(m,i){
    var parts=[{text:m.content||' '}];
    if(img&&i===msgs.length-1&&m.role==='user'){parts.push({inline_data:{mime_type:img.mime,data:img.b64}});}
    return {role:m.role==='assistant'?'model':'user',parts:parts};
   });
   var ctl=new AbortController();
   var to=setTimeout(function(){ctl.abort();},25000);
   var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':this.key},
    body:JSON.stringify({system_instruction:{parts:[{text:SYSTEM_PROMPT}]},contents:contents}),
    signal:ctl.signal});
   clearTimeout(to);
   if(!r.ok){var t=await r.text();throw {msg:r.status+' '+t.slice(0,200)};}
   var j=await r.json();
   return j.candidates[0].content.parts.map(function(x){return x.text;}).join('');
  }
 };
}
function openaiProvider(name,url,model,key){
 return {
  name:name,key:key,vision:false,
  call: async function(img){
   if(img){throw {msg:'مش بيقرا صور'};}
   var ctl=new AbortController();
   var to=setTimeout(function(){ctl.abort();},25000);
   var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+this.key},body:JSON.stringify({model:model,messages:[{role:'system',content:SYSTEM_PROMPT}].concat(msgs)}),signal:ctl.signal});
   clearTimeout(to);
   if(!r.ok){var t=await r.text();throw {msg:r.status+' '+t.slice(0,200)};}
   var j=await r.json();
   return j.choices[0].message.content;
  }
 };
}

var _puterLoading=null;
function loadPuter(){
 if(window.puter&&puter.ai)return Promise.resolve();
 if(_puterLoading)return _puterLoading;
 _puterLoading=new Promise(function(res,rej){
  var s=document.createElement('script');
  s.src='https://js.puter.com/v2/';
  s.onload=function(){res();};
  s.onerror=function(){rej({msg:'مكتبة Puter محملتش، اتأكد من النت'});};
  document.head.appendChild(s);
 });
 return _puterLoading;
}
function puterProvider(label,model){
 return {
  name:label,key:'puter',vision:true,
  call: async function(img){
   await loadPuter();
   if(!puter.auth.isSignedIn()){try{await puter.auth.signIn();}catch(e){throw {msg:'كلود محتاج تسجيل دخول Puter (مجاني)'}}}
   var r;
   if(img){
    var hist=msgs.slice(-12).map(function(m){return (m.role==='user'?'محمود: ':'انت: ')+m.content;}).join('\n');
    var prompt=SYSTEM_PROMPT+'\n\nالمحادثة لحد دلوقتي:\n'+hist+'\n\nرد على آخر رسالة من محمود (معاها صورة مرفوعة).';
    r=await puter.ai.chat(prompt,img.file,{model:model,vision:true});
   }else{
    r=await puter.ai.chat([{role:'system',content:SYSTEM_PROMPT}].concat(msgs),{model:model});
   }
   var c=r&&r.message&&r.message.content;
   if(typeof c==='string')return c;
   if(c&&c.length&&c[0].text)return c.map(function(x){return x.text||'';}).join('');
   if(r&&r.text)return r.text;
   return String(r);
  }
 };
}
var P=[];
function rebuild(){
 P=[
  geminiProvider('gemini-3.8-flash'),
  geminiProvider('gemini-3.5-flash-lite'),
  storeGet('k_claude')?puterProvider('Claude Sonnet','claude-sonnet-5-5'):null,
  storeGet('k_claude')?puterProvider('Claude Haiku','claude-haiku-5-5'):null,
  openaiProvider('Groq','https://api.groq.com/openai/v1/chat/completions','openai/gpt-oss-120b',storeGet('k_groq'))
 ].filter(function(p){return p&&p.key;});
}
function showSetup(){document.getElementById('setup').style.display='flex';chat.style.display='none';}
function clearKeys(){storeClear();rebuild();alert('اتمسحت ✅');location.reload();}
function saveKeys(){
 var saved=0;
 if(document.getElementById('k_claude').checked){storeSet('k_claude','1');saved++;}
 ['gemini','groq'].forEach(function(n){
  var v=document.getElementById('k_'+n).value.trim();
  if(v){storeSet('k_'+n,v);saved++;}
 });
 if(!saved){alert('حط مفتاح واحد على الأقل الأول 😊');return;}
 rebuild();
 document.getElementById('setup').style.display='none';
 chat.style.display='flex';
 var note='✅ اتسجل!';
 try{if(!localStorage.getItem('k_gemini')&&!localStorage.getItem('k_groq')){
  note='✅ اتسجل للجلسة دي. ملحوظة: موبايلك مش بيحفظ المفاتيح بعد قفل الصفحة، فلو قفلتها هتحط المفتاح تاني بس.';
 }}catch(e){}
 add(note,'ai');
}
rebuild();
loadMsgs();
if(!P.length){showSetup();}
function add(text,cls,who){
 var d=document.createElement('div');
 d.className='msg '+cls;
 var t=document.createElement('span');
 t.textContent=text;
 d.appendChild(t);
 if(who){
  var s=document.createElement('div');
  s.className='who';
  s.textContent=who;
  d.appendChild(s);
 }
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
 return d;
}
function addImgMsg(dataUrl,caption){
 var d=document.createElement('div');
 d.className='msg me';
 var im=new Image();
 im.src=dataUrl;
 im.className='thumb';
 d.appendChild(im);
 if(caption){
  var t=document.createElement('span');
  t.textContent=caption;
  d.appendChild(t);
 }
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}
function setMsg(d,text,who){
 d.textContent=text;
 if(who){
  var s=document.createElement('div');
  s.className='who';
  s.textContent=who;
  d.appendChild(s);
 }
 chat.scrollTop=chat.scrollHeight;
}
async function ask(img){
 var list=P;
 if(img){
  list=P.filter(function(p){return p.vision;});
  if(!list.length){return [null,'❌ قراءة الصور محتاجة مفتاح Gemini (أو تفعيل كلود من ⚙️). حط المفتاح من الإعدادات وجرب تاني.'];}
 }
 var errs=[];
 for(var i=0;i<list.length;i++){
  var p=list[i];
  try{
   var a=await p.call(img);
   msgs.push({role:'assistant',content:a});
   saveMsgs();
   return[p.name,a];
  }catch(e){
   errs.push(p.name+': '+(e.name==='AbortError'?'انتهت المهلة (الشبكة بطيئة أو محجوبة)':(e.msg||e.message||'خطأ غير معروف')));
  }
 }
 return[null,'❌ كل الخدمات فشلت. ابعتلي سكرين شوت من الرسالة دي:\n'+errs.join('\n')];
}
function clearChat(){if(!confirm('تمسح المحادثة كلها؟'))return;msgs=[];storeSet('k_msgs','');chat.innerHTML='';lastImg=null;lastImgCaption='';}

/* ===== صور المنتجات ===== */
var pendingImg=null,lastImg=null,lastImgCaption='';
function fitSize(w,h,max){
 var s=Math.min(1,max/Math.max(w,h));
 return [Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s))];
}
function downscaleFile(file,max){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file);
  var img=new Image();
  img.onload=function(){
   try{
    var wh=fitSize(img.width,img.height,max);
    var c=document.createElement('canvas');
    c.width=wh[0];c.height=wh[1];
    var x=c.getContext('2d');
    x.drawImage(img,0,0,wh[0],wh[1]);
    URL.revokeObjectURL(url);
    var dataUrl=c.toDataURL('image/jpeg',0.85);
    c.toBlob(function(b){
     if(!b){rej({msg:'تعذر تجهيز الصورة'});return;}
     res({dataUrl:dataUrl,b64:dataUrl.split(',')[1],mime:'image/jpeg',file:new File([b],'product.jpg',{type:'image/jpeg'})});
    },'image/jpeg',0.85);
   }catch(e){rej(e);}
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej({msg:'مش صورة صالحة'});};
  img.src=url;
 });
}
function pickImg(){document.getElementById('filein').click();}
async function onImg(ev){
 var f=ev.target.files&&ev.target.files[0];
 ev.target.value='';
 if(!f)return;
 try{
  pendingImg=await downscaleFile(f,1024);
  document.getElementById('pvimg').src=pendingImg.dataUrl;
  document.getElementById('pvbar').style.display='flex';
 }catch(e){
  add('❌ الصورة دي مش راضية تتقري، جرب صورة تانية.','ai');
 }
}
function clearPreview(){pendingImg=null;document.getElementById('pvbar').style.display='none';}

/* ===== استخراج السعر والصورة الجاهزة ===== */
function extractPrice(t){
 if(!t)return null;
 var s=String(t).replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d));});
 var m=s.match(/\d{2,5}/);
 return m?m[0]:null;
}
function overlayLayout(w,h){
 var band=Math.max(150,Math.round(h*0.26));
 var lineSize=Math.max(20,Math.round(w*0.038));
 return {
  band:band,
  brandSize:Math.round(Math.min(w,h)*0.09),
  lineSize:lineSize,
  step:Math.round(lineSize*1.45),
  pad:Math.round(w*0.04)
 };
}
function makePostImage(dataUrl,price){
 return new Promise(function(res){
  try{
   var img=new Image();
   img.onload=function(){
    try{
     var w=img.width,h=img.height;
     var c=document.createElement('canvas');
     c.width=w;c.height=h;
     var x=c.getContext('2d');
     x.drawImage(img,0,0,w,h);
     var L=overlayLayout(w,h);
     var g=x.createLinearGradient(0,h-L.band-60,0,h);
     g.addColorStop(0,'rgba(0,0,0,0)');
     g.addColorStop(1,'rgba(0,0,0,0.88)');
     x.fillStyle=g;
     x.fillRect(0,h-L.band-60,w,L.band+60);
     x.textAlign='center';
     x.shadowColor='rgba(0,0,0,0.7)';
     x.shadowBlur=8;
     x.direction='ltr';
     x.fillStyle='#d9b45b';
     x.font='bold '+L.brandSize+'px Georgia, serif';
     x.fillText('M&L',w/2,L.brandSize+L.pad);
     var lines=[];
     if(price){lines.push('السعر: '+price+' ج بس 💸');}
     lines.push('للطلب والاستفسار واتساب 📲');
     var y0=h-L.pad-(lines.length)*L.step;
     x.direction='rtl';
     x.fillStyle='#ffffff';
     x.font='bold '+L.lineSize+'px Tahoma, sans-serif';
     lines.forEach(function(ln,i){
      x.fillText(ln,w/2,y0+i*L.step);
     });
     x.direction='ltr';
     x.fillStyle='#d9b45b';
     x.font='bold '+L.lineSize+'px Tahoma, sans-serif';
     x.fillText('wa.me/201148434241',w/2,h-L.pad);
     res(c.toDataURL('image/png'));
    }catch(e){res(null);}
   };
   img.onerror=function(){res(null);};
   img.src=dataUrl;
  }catch(e){res(null);}
 });
}
async function tryOverlay(dataUrl,price){
 try{
  var out=await makePostImage(dataUrl,price);
  if(!out)return;
  var d=document.createElement('div');
  d.className='msg ai';
  var im=new Image();
  im.src=out;
  im.className='thumb';
  d.appendChild(im);
  var s=document.createElement('div');
  s.className='who';
  s.textContent='صورة جاهزة للنشر 🖼️';
  d.appendChild(s);
  var a=document.createElement('a');
  a.href=out;
  a.download='ml-post.png';
  a.className='dlbtn';
  a.textContent='⬇️ نزّل الصورة';
  d.appendChild(a);
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
 }catch(e){}
}

/* ===== الإدخال الصوتي ===== */
var rec=null,recOn=false,recBase='';
function stopMicUI(){
 recOn=false;
 var m=document.getElementById('mic');
 m.className='icobtn';
 m.textContent='🎤';
}
function toggleMic(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){add('😕 المتصفح ده مش بيدعم الكتابة بالصوت. جرب كروم على الموبايل.','ai');return;}
 if(recOn){try{rec.stop();}catch(e){}stopMicUI();return;}
 try{
  rec=new SR();
  rec.lang='ar-EG';
  rec.interimResults=true;
  rec.continuous=true;
  recBase=document.getElementById('in').value;
  rec.onresult=function(ev){
   var t='';
   for(var i=0;i<ev.results.length;i++){t+=ev.results[i][0].transcript;}
   document.getElementById('in').value=(recBase?recBase+' ':'')+t;
  };
  rec.onerror=function(ev){
   stopMicUI();
   if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){add('🎤 المايك محتاج إذن. اسمح بالمايك للموقع من إعدادات المتصفح وجرب تاني.','ai');}
   else if(ev.error==='network'){add('🎤 التعرف على الصوت محتاج نت شغال.','ai');}
  };
  rec.onend=function(){stopMicUI();};
  rec.start();
  recOn=true;
  var m=document.getElementById('mic');
  m.className='icobtn rec';
  m.textContent='⏹️';
 }catch(e){
  stopMicUI();
  add('😕 الصوت مش شغال هنا، جرب من كروم على الموبايل.','ai');
 }
}

async function send(){
 var inp=document.getElementById('in');
 var q=inp.value.trim();
 var img=pendingImg;
 if(!q&&!img)return;
 inp.value='';
 var imgForSend=null;
 var priceSrc=q;
 if(img){
  clearPreview();
  addImgMsg(img.dataUrl,q);
  imgForSend=img;
  lastImg=img;
  lastImgCaption=q;
 }else{
  add(q,'me');
  if(lastImg){imgForSend=lastImg;priceSrc=q+' '+lastImgCaption;}
  lastImg=null;
 }
 msgs.push({role:'user',content:(img?'📷 ':'')+(q||'صورة منتج')});
 saveMsgs();
 var w=add('⏳ بيفكر...','ai');
 var res=await ask(imgForSend);
 setMsg(w,res[1],res[0]);
 if(imgForSend&&res[0]){
  tryOverlay(imgForSend.dataUrl,extractPrice(priceSrc));
 }
}
</script>
